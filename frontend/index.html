<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sahara - Elderly Companion Platform</title>
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink-900 font-sans">
  
  <nav class="w-full px-6 py-6 flex items-center justify-between max-w-6xl mx-auto">
    <div class="flex items-center gap-2">
      <img src="/logo.png" alt="Sahara Logo" class="h-8">
      
    </div>
    <div class="flex items-center gap-4">
      <a href="/login.html" class="text-sm font-medium text-ink-600 hover:text-ink-900">Log in</a>
      <a href="/register.html" class="bg-primary-700 text-white text-sm font-medium px-5 py-2.5 rounded-xl hover:bg-primary-800 transition-all">Get Started</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-6 py-20 text-center">
    <div class="inline-flex items-center gap-2 bg-primary-100 text-primary-700 px-4 py-1.5 rounded-xl text-xs font-bold uppercase tracking-wider mb-8">
      <i data-lucide="heart" class="w-4 h-4"></i> Caring for our elders
    </div>
    <h1 class="text-5xl md:text-6xl font-extrabold text-ink-900 leading-tight mb-6">
      Never feel <span class="text-primary-700">alone</span> again.
    </h1>
    <p class="text-xl text-ink-400 max-w-2xl mx-auto mb-10">
      Sahara is an AI-powered companion designed to listen, assist, and care. 
      From medication reminders to a friendly chat, we are here for you.
    </p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a href="/register.html" class="w-full sm:w-auto bg-primary-700 text-white font-bold text-lg px-8 py-4 rounded-xl hover:bg-primary-800 transition-all shadow-card flex items-center justify-center gap-2">
        Meet Your Companion <i data-lucide="arrow-right"></i>
      </a>
    </div>
  </main>

  <script>lucide.createIcons();</script>
  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = '/dashboard.html';
  </script>
</body>
</html>
