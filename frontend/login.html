<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In – Sahara</title>
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="sh-page-wrap">

  <!-- Navigation -->
  <header class="sh-nav">
    <div class="sh-nav-inner">
      <a href="/" class="sh-nav-logo"><img src="/logo.png" alt="Sahara"></a>
      <nav class="sh-nav-links">
        <a href="/register.html" class="sh-nav-link">Create account</a>
      </nav>
    </div>
  </header>

  <!-- Form -->
  <div class="auth-layout">
    <div class="sh-card auth-card">

      <h1 class="auth-card-heading">Welcome back</h1>
      <p class="auth-card-sub">Sign in to your Sahara account.</p>

      <!-- Error banner -->
      <div id="error-message" class="alert alert-error hidden" role="alert">
        <i data-lucide="alert-circle"></i>
        <span id="error-text">Something went wrong.</span>
      </div>

      <form id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="identifier">Email address</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="mail"></i></span>
            <input
              class="form-input"
              type="email"
              id="identifier"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="lock"></i></span>
            <input
              class="form-input form-input-padded-right"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >
            <button type="button" class="pwd-toggle" id="toggle-password" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <a href="/forgot-password.html" class="form-footer-link">Forgot password?</a>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary btn-primary-full" style="margin-top:1.5rem;">
          Sign In
          <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
        </button>

      </form>

      <p class="switch-link">
        Don't have an account? <a href="/register.html" class="text-link">Sign up here</a>
      </p>

      <div class="demo-hint">
        <p><strong>🔑 Try the demo</strong></p>
        <p>Email: <strong>demo@sahara.com</strong> &nbsp;·&nbsp; Password: <strong>demo123</strong></p>
      </div>

    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="./js/auth.js"></script>
  <script>
    const toggle   = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('password');
    toggle.addEventListener('click', () => {
      const show = pwdInput.type === 'password';
      pwdInput.type = show ? 'text' : 'password';
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      toggle.innerHTML = show
        ? '<i data-lucide="eye-off" style="width:18px;height:18px;"></i>'
        : '<i data-lucide="eye"     style="width:18px;height:18px;"></i>';
      lucide.createIcons();
    });
  </script>

</body>
</html>
