<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Documents - Sahara</title>
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink-900 font-sans min-h-screen">
  
  <!-- Navbar -->
  <nav class="bg-white border-b border-ink-200 px-6 py-4 flex items-center gap-4">
    <a href="/dashboard.html" class="flex items-center gap-2 text-ink-600 hover:text-ink-900 font-semibold text-base">
      <i data-lucide="arrow-left" class="w-5 h-5"></i> Back to Home
    </a>
  </nav>

  <div class="max-w-2xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between">
      <h1 class="text-3xl font-bold text-ink-900">My Documents</h1>
      <button id="upload-btn" class="bg-primary-600 text-white font-semibold text-base px-5 py-3 rounded-xl hover:bg-primary-700 transition-all flex items-center gap-2">
        <i data-lucide="upload" class="w-5 h-5"></i> Upload
      </button>
    </div>

    <p class="text-base text-ink-600">Keep your important documents safe and accessible. Upload photos or scans of your ID cards, prescriptions, insurance papers, and more.</p>

    <!-- Upload Form (hidden by default) -->
    <div id="upload-form-container" class="hidden bg-white rounded-xl border border-ink-200 p-6">
      <h2 class="text-xl font-bold text-ink-900 mb-4">Upload Document</h2>
      <form id="upload-form" class="space-y-4">
        <div>
          <label for="doc-name" class="block text-base font-semibold text-ink-600 mb-2">Document Name</label>
          <input type="text" id="doc-name" required
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white"
            placeholder="e.g., Aadhaar Card, Prescription">
        </div>

        <div>
          <label for="doc-category" class="block text-base font-semibold text-ink-600 mb-2">Category</label>
          <select id="doc-category"
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white">
            <option value="id_document">ID Document (Aadhaar, PAN, etc.)</option>
            <option value="medical">Medical Record</option>
            <option value="prescription">Prescription</option>
            <option value="insurance">Insurance</option>
            <option value="legal">Legal Document</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div>
          <label for="doc-file" class="block text-base font-semibold text-ink-600 mb-2">Choose File</label>
          <div id="file-drop-zone" class="border-2 border-dashed border-ink-200 rounded-xl p-8 text-center cursor-pointer hover:border-green-500 hover:bg-primary-50 transition-all">
            <i data-lucide="file-up" class="w-10 h-10 text-ink-400 mx-auto mb-3"></i>
            <p class="text-base text-ink-600 font-medium">Tap to choose a file or take a photo</p>
            <p id="selected-file-name" class="text-sm text-primary-700 font-semibold mt-2 hidden"></p>
            <input type="file" id="doc-file" accept="image/*,.pdf" class="hidden" required>
          </div>
        </div>

        <div>
          <label for="doc-notes" class="block text-base font-semibold text-ink-600 mb-2">Notes (optional)</label>
          <textarea id="doc-notes" rows="2"
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white resize-none"
            placeholder="Any extra details..."></textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" id="upload-submit-btn" class="flex-1 bg-primary-600 text-white font-semibold text-lg py-4 rounded-xl hover:bg-primary-700 transition-all flex items-center justify-center gap-2">
            <i data-lucide="upload" class="w-5 h-5"></i> Upload Document
          </button>
          <button type="button" id="upload-cancel-btn" class="bg-ink-100 text-ink-600 font-semibold text-lg py-4 px-6 rounded-xl hover:bg-ink-200 transition-all">
            Cancel
          </button>
        </div>
      </form>
    </div>

    <!-- Category Filter -->
    <div class="flex flex-wrap gap-2">
      <button data-category="all" class="cat-btn bg-primary-600 text-white font-semibold text-sm px-4 py-2 rounded-xl transition-all">All</button>
      <button data-category="id_document" class="cat-btn bg-ink-100 text-ink-600 font-semibold text-sm px-4 py-2 rounded-xl hover:bg-ink-200 transition-all">ID Documents</button>
      <button data-category="medical" class="cat-btn bg-ink-100 text-ink-600 font-semibold text-sm px-4 py-2 rounded-xl hover:bg-ink-200 transition-all">Medical</button>
      <button data-category="prescription" class="cat-btn bg-ink-100 text-ink-600 font-semibold text-sm px-4 py-2 rounded-xl hover:bg-ink-200 transition-all">Prescriptions</button>
      <button data-category="insurance" class="cat-btn bg-ink-100 text-ink-600 font-semibold text-sm px-4 py-2 rounded-xl hover:bg-ink-200 transition-all">Insurance</button>
      <button data-category="legal" class="cat-btn bg-ink-100 text-ink-600 font-semibold text-sm px-4 py-2 rounded-xl hover:bg-ink-200 transition-all">Legal</button>
    </div>

    <!-- Documents List -->
    <div id="documents-list">
      <div class="skeleton h-20 w-full mb-3"></div>
      <div class="skeleton h-20 w-full"></div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-12">
      <div class="w-20 h-20 rounded-xl bg-cream flex items-center justify-center mx-auto mb-4">
        <i data-lucide="folder-open" class="text-ink-400 w-10 h-10"></i>
      </div>
      <h2 class="text-xl font-bold text-ink-600 mb-2">No documents yet</h2>
      <p class="text-base text-ink-600">Upload your first document to keep it safe and accessible.</p>
    </div>
  </div>

  <script type="module" src="./js/vault.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
