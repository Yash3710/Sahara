<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Sahara</title>
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink-900 font-sans min-h-screen flex flex-col">
  
  <nav class="w-full px-6 py-6 flex items-center justify-between max-w-2xl mx-auto">
    <a href="/" class="flex items-center gap-2">
      <img src="/logo.png" alt="Sahara" class="h-8">
    </a>
    <a href="/login.html" class="text-base font-medium text-primary-700 hover:text-primary-800">Log in</a>
  </nav>

  <main class="flex-1 flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-md">
      <h1 class="text-3xl font-bold text-ink-900 text-center mb-2">Create Your Account</h1>
      <p class="text-lg text-ink-600 text-center mb-8">Join Sahara - your caring companion</p>

      <div id="error-message" class="hidden bg-secondary-50 border border-secondary-200 text-secondary-600 rounded-xl p-4 mb-6 flex items-start gap-3">
        <i data-lucide="alert-circle" class="w-6 h-6 shrink-0 mt-0.5"></i>
        <span id="error-text" class="text-base font-medium">Something went wrong.</span>
      </div>

      <div id="success-message" class="hidden bg-primary-50 border border-green-200 text-primary-700 rounded-xl p-4 mb-6 flex items-start gap-3">
        <i data-lucide="check-circle" class="w-6 h-6 shrink-0 mt-0.5"></i>
        <span id="success-text" class="text-base font-medium"></span>
      </div>

      <form id="register-form" class="space-y-5">
        <div>
          <label for="email" class="block text-base font-semibold text-ink-600 mb-2">Email Address</label>
          <input type="email" id="email" name="email" required 
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white"
            placeholder="your@email.com">
        </div>

        <div>
          <label for="password" class="block text-base font-semibold text-ink-600 mb-2">Password</label>
          <input type="password" id="password" name="password" required minlength="6"
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white"
            placeholder="At least 6 characters">
        </div>

        <div>
          <label for="confirm-password" class="block text-base font-semibold text-ink-600 mb-2">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm-password" required minlength="6"
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white"
            placeholder="Type your password again">
        </div>

        <button type="submit" id="submit-btn"
          class="w-full bg-primary-700 text-white text-lg font-bold py-4 px-6 rounded-xl hover:bg-primary-800 transition-all flex items-center justify-center gap-2">
          Create Account <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </form>

      <p class="text-center text-base text-ink-600 mt-8">
        Already have an account? 
        <a href="/login.html" class="text-primary-700 font-semibold hover:underline">Log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="./js/register.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
