<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – Sahara</title>
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="sh-page-wrap">

  <!-- Navigation -->
  <header class="sh-nav">
    <div class="sh-nav-inner">
      <a href="/" class="sh-nav-logo"><img src="/logo.png" alt="Sahara"></a>
      <nav class="sh-nav-links">
        <a href="/login.html" class="sh-nav-link">Log in</a>
      </nav>
    </div>
  </header>

  <!-- Form -->
  <div class="auth-layout">
    <div class="sh-card auth-card">

      <h1 class="auth-card-heading">Create your account</h1>
      <p class="auth-card-sub">Join Sahara — your caring everyday companion.</p>

      <!-- Error banner -->
      <div id="error-message" class="alert alert-error hidden" role="alert">
        <i data-lucide="alert-circle"></i>
        <span id="error-text">Something went wrong.</span>
      </div>

      <!-- Success banner -->
      <div id="success-message" class="alert alert-success hidden" role="status">
        <i data-lucide="check-circle"></i>
        <span id="success-text"></span>
      </div>

      <form id="register-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="mail"></i></span>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="lock"></i></span>
            <input
              class="form-input form-input-padded-right"
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              placeholder="At least 6 characters"
              minlength="6"
              required
            >
            <button type="button" class="pwd-toggle" id="toggle-password" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
          <span class="field-hint">Minimum 6 characters.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm password</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="lock-keyhole"></i></span>
            <input
              class="form-input form-input-padded-right"
              type="password"
              id="confirm-password"
              name="confirm-password"
              autocomplete="new-password"
              placeholder="Type your password again"
              minlength="6"
              required
            >
            <button type="button" class="pwd-toggle" id="toggle-confirm" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary btn-primary-full" style="margin-top:1.5rem;">
          Create Account
          <i data-lucide="arrow-right" style="width:18px;height:18px;"></i>
        </button>

      </form>

      <p class="switch-link">
        Already have an account? <a href="/login.html" class="text-link">Log in</a>
      </p>

    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="./js/register.js"></script>
  <script>
    function makeToggle(toggleId, inputId) {
      const toggle = document.getElementById(toggleId);
      const input  = document.getElementById(inputId);
      toggle.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        toggle.innerHTML = show
          ? '<i data-lucide="eye-off" style="width:18px;height:18px;"></i>'
          : '<i data-lucide="eye"     style="width:18px;height:18px;"></i>';
        lucide.createIcons();
      });
    }
    makeToggle('toggle-password', 'password');
    makeToggle('toggle-confirm',  'confirm-password');
  </script>

</body>
</html>
