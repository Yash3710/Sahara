<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Sahara</title>
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="sh-page-wrap">

  <!-- Navigation -->
  <header class="sh-nav">
    <div class="sh-nav-inner">
      <a href="/" class="sh-nav-logo"><img src="/logo.png" alt="Sahara"></a>
      <nav class="sh-nav-links">
        <a href="/login.html" class="sh-nav-link">Log in</a>
      </nav>
    </div>
  </header>

  <!-- Form -->
  <div class="auth-layout">
    <div class="sh-card auth-card">

      <a href="/login.html" class="back-link">
        <i data-lucide="arrow-left"></i> Back to Log in
      </a>

      <h1 class="auth-card-heading">Reset your password</h1>
      <p class="auth-card-sub">Enter your email and we'll send you a reset link.</p>

      <div id="error-message" class="alert alert-error hidden" role="alert">
        <i data-lucide="alert-circle"></i>
        <span id="error-text">Something went wrong.</span>
      </div>
      <div id="success-message" class="alert alert-success hidden" role="status">
        <i data-lucide="check-circle"></i>
        <span id="success-text"></span>
      </div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon"><i data-lucide="mail"></i></span>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            >
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary btn-primary-full" style="margin-top:1.5rem;">
          Send Reset Link
          <i data-lucide="send" style="width:18px;height:18px;"></i>
        </button>
      </form>

    </div>
  </div>

  <script>lucide.createIcons();</script>
  <script type="module" src="./js/forgot-password.js"></script>

</body>
</html>
