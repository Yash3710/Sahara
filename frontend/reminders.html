<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reminders - Sahara</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink-900 font-sans min-h-screen">

  <!-- Shared app nav -->
  <div id="app-nav"></div>

  <!-- Page heading -->
  <div style="background:#FFFFFF;border-bottom:1px solid #E5E3DD;">
    <div style="max-width:960px;margin:0 auto;padding:1rem 1.5rem;display:flex;align-items:center;gap:0.75rem;">
      <div style="width:36px;height:36px;border-radius:0.625rem;background:#E8F1F8;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i data-lucide="bell" style="width:17px;height:17px;color:#06477D;stroke:#06477D;"></i>
      </div>
      <div>
        <p style="font-size:1.1rem;font-weight:800;color:#20252B;line-height:1.2;margin:0;">My Reminders</p>
        <p style="font-size:0.78rem;color:#77766F;margin:0;">Manage your medicines, tasks and appointments</p>
      </div>
    </div>
  </div>

  <div class="max-w-2xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between">
      <h1 class="text-3xl font-bold text-ink-900">My Reminders</h1>
      <button id="add-reminder-btn" class="bg-primary-600 text-white font-semibold text-base px-5 py-3 rounded-xl hover:bg-primary-700 transition-all flex items-center gap-2">
        <i data-lucide="plus" class="w-5 h-5"></i> Add New
      </button>
    </div>

    <!-- Add/Edit Form (hidden by default) -->
    <div id="reminder-form-container" class="hidden bg-white rounded-xl border border-ink-200 p-6">
      <h2 id="form-title" class="text-xl font-bold text-ink-900 mb-4">Add New Reminder</h2>
      <form id="reminder-form" class="space-y-4">
        <input type="hidden" id="form-id" value="">
        <input type="hidden" id="form-type" value="reminder">
        
        <!-- Type selector -->
        <div>
          <label class="block text-base font-semibold text-ink-600 mb-2">Type</label>
          <div class="flex gap-3">
            <button type="button" data-type="reminder" class="type-btn flex-1 py-3 px-4 rounded-xl border-2 border-primary-600 bg-primary-50 text-primary-700 font-semibold text-base transition-all">
              <i data-lucide="bell" class="w-5 h-5 inline"></i> Reminder
            </button>
            <button type="button" data-type="appointment" class="type-btn flex-1 py-3 px-4 rounded-xl border-2 border-ink-200 bg-white text-ink-600 font-semibold text-base transition-all hover:border-blue-400">
              <i data-lucide="stethoscope" class="w-5 h-5 inline"></i> Appointment
            </button>
          </div>
        </div>

        <!-- Common: Title -->
        <div>
          <label for="form-title-input" class="block text-base font-semibold text-ink-600 mb-2" id="title-label">What is this reminder for?</label>
          <input type="text" id="form-title-input" required
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white"
            placeholder="e.g., Take blood pressure medicine">
        </div>

        <!-- Appointment: Doctor Name -->
        <div id="doctor-field" class="hidden">
          <label for="form-doctor" class="block text-base font-semibold text-ink-600 mb-2">Doctor Name</label>
          <input type="text" id="form-doctor"
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white"
            placeholder="e.g., Dr. Sharma">
        </div>

        <!-- Date & Time -->
        <div>
          <label for="form-datetime" class="block text-base font-semibold text-ink-600 mb-2" id="datetime-label">When?</label>
          <input type="datetime-local" id="form-datetime" required
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white">
        </div>

        <!-- Notes -->
        <div>
          <label for="form-notes" class="block text-base font-semibold text-ink-600 mb-2">Notes (optional)</label>
          <textarea id="form-notes" rows="2"
            class="w-full text-lg py-4 px-5 border-2 border-ink-200 rounded-xl focus:border-primary-600 focus:ring-0 bg-white resize-none"
            placeholder="Any extra details..."></textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="submit" id="form-submit-btn" class="flex-1 bg-primary-600 text-white font-semibold text-lg py-4 rounded-xl hover:bg-primary-700 transition-all">
            Save Reminder
          </button>
          <button type="button" id="form-cancel-btn" class="bg-ink-100 text-ink-600 font-semibold text-lg py-4 px-6 rounded-xl hover:bg-ink-200 transition-all">
            Cancel
          </button>
        </div>
      </form>
    </div>

    <!-- Reminders List -->
    <div id="reminders-section">
      <h2 class="text-xl font-bold text-ink-900 mb-3">Medications & Reminders</h2>
      <div id="reminders-list" class="space-y-3">
        <div class="skeleton h-20 w-full"></div>
        <div class="skeleton h-20 w-full"></div>
      </div>
    </div>

    <div id="appointments-section" class="mt-8">
      <h2 class="text-xl font-bold text-ink-900 mb-3">Appointments</h2>
      <div id="appointments-list" class="space-y-3">
        <div class="skeleton h-20 w-full"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/reminders.js"></script>
  <script type="module" src="./js/nav.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
