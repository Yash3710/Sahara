<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Companion – Sahara</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #F8F7F3;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Hide the old redundant chat-nav — shared nav + heading bar replace it */
    .chat-nav { display: none; }

    /* ── Top bar ── */
    .chat-nav {
      background: #FFFFFF;
      border-bottom: 1px solid #E5E3DD;
      padding: 0 1.25rem;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }
    .chat-nav-back {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.9rem; font-weight: 600; color: #77766F;
      text-decoration: none;
      padding: 0.4rem 0.75rem; border-radius: 0.5rem;
      transition: background 140ms, color 140ms;
      min-height: 40px;
    }
    .chat-nav-back:hover { background: #F8F7F3; color: #20252B; }
    .chat-nav-back svg  { width: 16px; height: 16px; }

    .chat-nav-identity {
      display: flex; align-items: center; gap: 0.6rem;
    }
    .chat-nav-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #06477D 0%, #0d6ebd 100%);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; position: relative;
    }
    .chat-nav-avatar svg { width: 17px; height: 17px; color: #fff; stroke: #fff; }
    .chat-nav-online {
      position: absolute; bottom: 1px; right: 1px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #22C55E; border: 2px solid #FFFFFF;
    }
    .chat-nav-name  { font-size: 0.95rem; font-weight: 700; color: #20252B; }
    .chat-nav-status { font-size: 0.72rem; color: #22C55E; font-weight: 600; }

    /* spacer keeps identity centred */
    .chat-nav-spacer { width: 90px; }

    /* ── Message area ── */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }
    /* custom scrollbar */
    #chat-messages::-webkit-scrollbar { width: 5px; }
    #chat-messages::-webkit-scrollbar-track { background: transparent; }
    #chat-messages::-webkit-scrollbar-thumb { background: #E5E3DD; border-radius: 9999px; }

    .chat-inner {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* ── Bubbles ── */
    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 0.6rem;
    }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.assistant { justify-content: flex-start; }

    .bubble-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #06477D 0%, #0d6ebd 100%);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-bottom: 2px;
    }
    .bubble-avatar svg { width: 15px; height: 15px; color: #fff; stroke: #fff; }

    .bubble {
      max-width: 78%;
      padding: 0.85rem 1.1rem;
      border-radius: 1.1rem;
      font-size: 0.95rem;
      line-height: 1.6;
      word-break: break-word;
    }
    /* Assistant bubble */
    .bubble.assistant {
      background: #FFFFFF;
      border: 1px solid #E5E3DD;
      color: #20252B;
      border-bottom-left-radius: 0.3rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    /* User bubble */
    .bubble.user {
      background: #06477D;
      color: #FFFFFF;
      border-bottom-right-radius: 0.3rem;
      box-shadow: 0 2px 8px rgba(6,71,125,0.2);
    }

    /* ── Thinking dots ── */
    #thinking-indicator {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      padding: 0 0 0.25rem;
    }
    #thinking-indicator.hidden { display: none; }

    .thinking-row {
      display: flex; align-items: flex-end; gap: 0.6rem;
    }
    .thinking-bubble {
      background: #FFFFFF;
      border: 1px solid #E5E3DD;
      border-radius: 1.1rem;
      border-bottom-left-radius: 0.3rem;
      padding: 0.75rem 1rem;
      display: flex; align-items: center; gap: 0.3rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #C8C5BE;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); background: #06477D; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }

    /* ── Error banner ── */
    #chat-error {
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
      padding: 0 0 0.25rem;
    }
    #chat-error.hidden { display: none; }
    .error-inner {
      background: #FFF0F0;
      border: 1px solid #FCCACA;
      border-radius: 0.75rem;
      padding: 0.7rem 1rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem;
    }
    #chat-error-text { font-size: 0.85rem; color: #991B1B; font-weight: 500; }
    #retry-btn {
      font-size: 0.82rem; font-weight: 700; color: #06477D;
      background: none; border: none; cursor: pointer;
      text-decoration: underline; font-family: inherit;
      flex-shrink: 0; min-height: unset;
    }

    /* ── Input bar ── */
    .chat-input-bar {
      background: #FFFFFF;
      border-top: 1px solid #E5E3DD;
      padding: 0.85rem 1rem 1rem;
      flex-shrink: 0;
    }
    #chat-form {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      background: #F8F7F3;
      border: 1.5px solid #E5E3DD;
      border-radius: 1.25rem;
      padding: 0.35rem 0.35rem 0.35rem 1.1rem;
      transition: border-color 160ms, box-shadow 160ms;
    }
    #chat-form:focus-within {
      border-color: #06477D;
      box-shadow: 0 0 0 3px rgba(6,71,125,0.1);
      background: #FFFFFF;
    }
    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.95rem;
      color: #20252B;
      font-family: inherit;
      padding: 0.55rem 0;
      min-height: unset;
      resize: none;
    }
    #chat-input::placeholder { color: #B0AEA7; }
    #chat-input:disabled    { opacity: 0.5; }

    #send-btn {
      width: 40px; height: 40px;
      border-radius: 0.875rem;
      background: #06477D;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 150ms, transform 120ms;
      min-height: unset;
    }
    #send-btn:hover:not(:disabled) { background: #054070; }
    #send-btn:active:not(:disabled) { transform: scale(0.93); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    #send-btn svg { width: 17px; height: 17px; color: #fff; stroke: #fff; }

    /* hint text below input */
    .chat-hint {
      text-align: center;
      font-size: 0.72rem;
      color: #B0AEA7;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Shared app nav -->
  <div id="app-nav"></div>

  <!-- Chat page heading -->
  <div style="background:#FFFFFF;border-bottom:1px solid #E5E3DD;flex-shrink:0;">
    <div style="max-width:960px;margin:0 auto;padding:0.7rem 1.25rem;display:flex;align-items:center;gap:0.7rem;">
      <div style="width:32px;height:32px;border-radius:0.5rem;background:#E8F1F8;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <i data-lucide="message-circle" style="width:15px;height:15px;color:#06477D;stroke:#06477D;"></i>
      </div>
      <div>
        <h1 style="font-size:1rem;font-weight:800;color:#20252B;margin:0;line-height:1.2;">AI Companion</h1>
        <p style="font-size:0.72rem;color:#77766F;margin:0;">Sahara is here to listen and help</p>
      </div>
    </div>
  </div>

  <!-- Chat header (shows Sahara online status) -->
  <header class="chat-nav">
    <a href="/dashboard.html" class="chat-nav-back">
      <i data-lucide="arrow-left"></i> Home
    </a>

    <div class="chat-nav-identity">
      <div class="chat-nav-avatar">
        <i data-lucide="message-circle"></i>
        <span class="chat-nav-online"></span>
      </div>
      <div>
        <p class="chat-nav-name">Sahara</p>
        <p class="chat-nav-status">Online</p>
      </div>
    </div>

    <div class="chat-nav-spacer"></div>
  </header>

  <!-- Messages -->
  <div id="chat-messages">
    <div class="chat-inner">

      <!-- Welcome message -->
      <div class="bubble-row assistant">
        <div class="bubble-avatar"><i data-lucide="message-circle"></i></div>
        <div class="bubble assistant">
          Hello! I'm Sahara, your companion. I'm here to listen and help. How are you feeling today? 😊
        </div>
      </div>

    </div>
  </div>

  <!-- Thinking indicator -->
  <div id="thinking-indicator" class="hidden" style="padding:0 1rem 0.5rem;">
    <div style="max-width:680px;margin:0 auto;">
      <div class="thinking-row">
        <div class="bubble-avatar"><i data-lucide="message-circle"></i></div>
        <div class="thinking-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Error banner -->
  <div id="chat-error" class="hidden" style="padding:0 1rem 0.25rem;">
    <div style="max-width:680px;margin:0 auto;">
      <div class="error-inner">
        <span id="chat-error-text">Could not send message.</span>
        <button id="retry-btn">Retry</button>
      </div>
    </div>
  </div>

  <!-- Input bar -->
  <div class="chat-input-bar">
    <form id="chat-form">
      <input
        type="text"
        id="chat-input"
        placeholder="Type a message…"
        autocomplete="off"
      >
      <button type="submit" id="send-btn" aria-label="Send message">
        <i data-lucide="send"></i>
      </button>
    </form>
    <p class="chat-hint">Sahara is here for you — say anything on your mind.</p>
  </div>

  <script type="module" src="./js/companion.js"></script>
  <script type="module" src="./js/nav.js"></script>
  <script>
    lucide.createIcons();

    // companion.js calls addMessage() which builds .flex.justify-end / .flex.items-start.gap-3
    // Override addMessage rendering to use the new bubble classes.
    // We patch it by replacing the innerHTML templates used inside companion.js
    // by observing the DOM and reformatting newly added children.
    const chatMessages = document.getElementById('chat-messages');
    const chatInner = chatMessages.querySelector('.chat-inner');

    // Move all dynamically added children (appended by companion.js to #chat-messages)
    // into .chat-inner and apply the new bubble classes.
    const observer = new MutationObserver(mutations => {
      mutations.forEach(m => {
        m.addedNodes.forEach(node => {
          if (node.nodeType !== 1) return;
          // Already inside chat-inner — skip
          if (node.closest('.chat-inner')) return;

          // companion.js appends directly to #chat-messages
          // Determine role from existing class
          const isUser = node.classList.contains('justify-end') ||
                         node.querySelector('.bg-green-600, [class*="bg-primary"]')?.closest('.rounded-tr-sm') != null ||
                         node.innerHTML.includes('rounded-tr-sm');

          // Build new bubble markup
          const textEl = node.querySelector('p');
          const text = textEl ? textEl.textContent : node.textContent;

          const row = document.createElement('div');
          if (isUser) {
            row.className = 'bubble-row user';
            row.innerHTML = `<div class="bubble user">${textEl ? textEl.innerHTML : text}</div>`;
          } else {
            row.className = 'bubble-row assistant';
            row.innerHTML = `
              <div class="bubble-avatar"><i data-lucide="message-circle"></i></div>
              <div class="bubble assistant">${textEl ? textEl.innerHTML : text}</div>`;
          }

          chatInner.appendChild(row);
          node.remove();
          if (window.lucide) lucide.createIcons();
          chatMessages.scrollTop = chatMessages.scrollHeight;
        });
      });
    });

    observer.observe(chatMessages, { childList: true });
  </script>

</body>
</html>
